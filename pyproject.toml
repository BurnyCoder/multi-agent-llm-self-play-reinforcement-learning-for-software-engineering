[project]
name = "multi-agent-ssr"
version = "0.1.0"
description = "Local shared-policy multi-agent self-play reinforcement learning for repository repair"
readme = "README.md"
authors = [
    { name = "Libor Burny Burian" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7.1", "huggingface-hub>=1.0", "numpy>=2.0",
    "matplotlib>=3.10", "reportlab>=4.4", "pypdf>=6.0", "python-dotenv>=1.0",
]

[project.optional-dependencies]
gpu = ["unsloth==2026.10.10", "unsloth-zoo==2026.10.10"]
benchmark = ["swebench==5.0.2"]

[project.scripts]
selfplay = "multi_agent_ssr.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = ["docker: disposable container integration tests", "gpu: real-model GPU checks"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
